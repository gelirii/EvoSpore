<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#07131b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>EvoSpore</title>
    <style>
      html,body,#app{margin:0;min-height:100%;background:#061218;color:#eaf4f6;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      #boot-fallback{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;color:#9ebac0}
    </style>
    <script>
      window.setTimeout(function () {
        var fallback = document.getElementById('boot-fallback');
        if (fallback) fallback.innerHTML = '<div><strong style="color:#eaf4f6">EvoSpore could not finish loading.</strong><br><br>Reload the page to fetch the current v0.2 build.</div>';
      }, 8000);
    </script>
  </head>
  <body>
    <div id="app"><div id="boot-fallback">Loading EvoSpore v0.2…</div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
