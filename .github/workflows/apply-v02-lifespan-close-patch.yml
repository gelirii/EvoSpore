name: Apply v0.2 lifespan and fossil close patch

on:
  push:
    branches:
      - v0.2-lifespan-fossil-close-fix
    paths:
      - .github/workflows/apply-v02-lifespan-close-patch.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0.2-lifespan-fossil-close-fix
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply targeted fixes
        run: python scripts/apply_v02_lifespan_close_patch.py
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run full v0.2 gate
        run: npm run build
      - name: Commit tested fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/sim/world.ts src/main.ts src/styles.css
          git commit -m "Polish v0.2 lifespan and fossil close control"
          git push origin HEAD:v0.2-lifespan-fossil-close-fix
