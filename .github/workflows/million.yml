name: Million-step EvoSpore analysis

on:
  push:
    branches:
      - analysis/million-step-burnin
  workflow_dispatch:

permissions:
  contents: read

jobs:
  million:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Run 1,000,000 simulation steps
        run: npx tsx tests/million.ts
