name: Test EvoSpore v0.3 behaviour

on:
  push:
    branches:
      - v0.3-life-history-movement
    paths:
      - .github/workflows/v03-life-history-test.yml

permissions:
  contents: read

jobs:
  behaviour:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0.3-life-history-movement
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - name: Run v0.3 movement and life-history analysis
        run: npx tsx tests/v03_behavior.ts
