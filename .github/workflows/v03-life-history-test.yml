name: Test EvoSpore v0.3 symmetry v2

on:
  push:
    branches:
      - v0.3-life-history-movement
    paths:
      - .github/workflows/v03-life-history-test.yml

permissions:
  contents: write

jobs:
  symmetry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0.3-life-history-movement
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply RNG-neutral lateral symmetry patch
        run: python scripts/apply_v03_lateral_symmetry.py
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Run movement and life-history analysis
        run: npx tsx tests/v03_behavior.ts
      - name: Commit tested symmetry patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/sim/types.ts src/sim/world.ts
          git commit -m "Remove pond-wide steering chirality"
          git push origin HEAD:v0.3-life-history-movement
